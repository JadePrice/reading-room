[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reading-room"
version = "0.3.0"
description = "A fast, privacy-preserving, accessible digital reading room for public records and document archives."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Reading Room Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: News Media",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
ocr = [
    "ocrmypdf>=16.0.0",
    "pdfplumber>=0.11.0",
]
search = [
    "pagefind[bin]==1.5.2",
]

[project.scripts]
roomkit = "roomkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["roomkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
