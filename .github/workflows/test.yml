name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install OCR system tools
      # ocrmypdf shells out to these; the OCR tests run the real pipeline.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends tesseract-ocr ghostscript unpaper pngquant

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev,ocr,browser,search]"
        python -m playwright install --with-deps chromium

    - name: Run ruff lint
      run: |
        ruff check roomkit/ tests/

    - name: Run mypy
      # Reported, not yet gating: strict mode has a typing backlog to clear first.
      continue-on-error: true
      run: |
        mypy roomkit/

    - name: Run pytest
      run: |
        pytest tests/
