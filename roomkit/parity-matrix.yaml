# Reading-room parity matrix: what the unified room must do before any cutover.
#
# Plan: conductor/plans/2026-10-13-unified-reading-room-frontend.md (Task 1).
# Wiki: wiki/reading-room-parity.md.
#
# Inventory read 2026-10-13 from plugin source on gg-core:
#   glassgovernment-site 56f30dc  wp-content/plugins/gg-reading-room
#   deflockdane-site     a5357f4  wp-content/plugins/deflock-reading-room
# and compared against roomkit 0.3.0 (53fcce4b).
#
# Fields
#   id           stable key; `roomkit parity --matrix` reports by it
#   surface      document | index | collections | topics | entities | power-maps |
#                requests | translation | read-aloud | sitemaps | machine-text |
#                files | chrome | admin
#   live         what the WordPress room does today, with its source
#   disposition  static        the unified room builds it
#                static-later  the unified room builds it, after cutover (not blocking)
#                dynamic-api   the room calls an existing endpoint, same origin
#                stays-wordpress  the URL keeps going to WordPress after cutover
#                deferred      on hold by user decision 2026-10-13 (power maps,
#                              records requests, translation); the room links to
#                              the WordPress URL meanwhile
#                dropped       not carried over; needs `signoff` (user, dated)
#   sites        per site: need (required | optional | n/a) and status
#                (done | partial | missing). `done` only when a check proves it.
#   acceptance   what "same as live" means for this row
#   check        the check that proves it (parity.<name> = automated, every row;
#                browser = named sample in a browser)
#
# Cutover rule: every row whose disposition is static and whose need is
# `required` must be `done` for that site. `deferred`, `stays-wordpress` and
# signed-off `dropped` rows do not block.

