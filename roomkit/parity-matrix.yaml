- id: index-suggest
  surface: index
  live: "GG combobox suggest (REST suggest). dd suggest panel from embedded data: top matches, agencies, vendors, document types, years, recent documents, recent searches (localStorage), 'Try searching'"
  disposition: static
  sites:
    deflockdane: {need: required, status: done}     # site panel, groups equal live, 2026-10-20
    glassgovernment: {need: required, status: partial}
  # 2026-10-20 (dd): manifest site.index.suggest carries live's own panel (labels, top N,
  # recent documents, Try searching, Agencies, Surveillance vendors, Document types, Years, with
  # live's per-group limits for an empty and a typed box), from the shortcode's archive payload;
  # room-search.js draws it in live's order. dd pack turns corpus-search on. Compared in a browser
  # against live via the origin for "", Flock, green, 2025, agree, capitol, zzzz: every group and
  # item equal. Top matches: the user's go (2026-10-20) to port live's scoreDoc; the exporter
  # writes site.index.suggest.rank (what prepareDoc reads per record) and room-search.js scores
  # it as live does. Then 14 inputs ("", Flock, green, 2025, agree, capitol, zzzz, sheriff, uw,
  # axon, policy, retention, dane county, purchase order): every group, item and top-match
  # order equal. Not drawn: live's "See all results for" row and its summary line.
  # 2026-10-14 (room-search): built from the room's Pagefind index (pack features.corpus-search),
  # no server call. Implemented: top matches, one group per facet the room holds (agency or
  # category, year, and any other facet the manifest carries: vendors and document types only where
  # the exporter puts them in facets), recent documents (newest first), recent searches
  # (localStorage). Not implemented: "Try searching" (no curated list in the manifest or pack to
  # draw it from; it would have to be invented) and per-group counts beyond the facet's. The packs
  # ship with the switch off until the live comparison is done.
  acceptance: "same suggestion groups; data embedded at build, no server call"
  check: browser

- id: index-fulltext-search
  surface: index
