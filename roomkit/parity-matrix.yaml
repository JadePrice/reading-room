  disposition: static
  sites:
    deflockdane: {need: required, status: done}     # 98.5% recall; 3 explained misses accepted by the user, 2026-10-20
    glassgovernment: {need: required, status: partial}
  # 2026-10-20 (dd): pack corpus-search on; the index also carries display.notes (the public
  # notes the record page shows). Live results from exporters/deflockdane-fetch-search.sh via the
  # origin (search-queries/deflockdane-2026-10-20.json, 30 queries): recall 98.5%. The 3 misses are
  # live ignoring query words, not room misses: tokens under 3 characters are dropped ("UW") and
  # only the first 8 tokens are required ("justification" in a 9-word title). The user accepted
  # these as explained differences on 2026-10-20 ("yes"), so the room keeps its stricter match.
  # 2026-10-14 (room-search): Pagefind 1.5.2 index over title, summary, citation, agency, group and
  # page text, behind pack features.corpus-search; `roomkit parity --search LIVE.json --out ROOM`
  # is the check (search_parity.py; GG's query set is search-queries/glassgovernment-2026-10-14.json).
  # Was 74.1% at N=100: every miss was a record with no page text (95 of 390). Since
  # 2026-10-14 those carry search_text (indexed, never shown): 99.1% at N=100 on the 12-query
  # set, 91.0% on the 25-query -wide set, 80% of 20 exact titles in the top 3 (see wiki/roomkit.md).
  # The wide misses are ranking (55 live hits ranked 101-289 on broad queries) or live's loose
  # matching (13: 287(g), malcolm x); title misses are numbered series parts outranking each other.
  # Partial: ranking on broad queries and title-of-a-part lookups, and dd's live results have not
  # been fed in (Cloudflare 429s; the Mac supplies them).
  acceptance: "for a fixed query set, every live hit appears in the room's top N (Pagefind)"
  check: parity.search

